const LESSON=`<div class="les"><h2>📖 Leçon : l'Avid Attic</h2>
<h3>1. C'est quoi l'Attic ?</h3><p>L'Attic (« grenier ») est un dossier où Avid range des copies de sauvegarde de tes bins. Si un bin est corrompu, supprimé par erreur ou écrasé, tu peux y retrouver une version antérieure et récupérer ton travail.</p>
<h3>2. Où le trouver ?</h3><ul><li><b>Windows :</b> <code>drive:/Users/Public/Public Documents/Avid editing application</code></li><li><b>Mac :</b> <code>Macintosh HD/Users/Shared/Avid editing application/Avid Attic</code></li></ul>
<h3>3. Comment il est organisé</h3><ol><li>Un dossier <b>par projet</b></li><li>Dans le projet, le dossier <b>Bins</b></li><li>Dans Bins, un dossier <b>par bin</b> (Audio, Clips, Graphics, Sequences, Titles…)</li></ol>
<h3>4. Les fichiers de sauvegarde</h3><p>Une sauvegarde porte le <b>même nom que le bin avec un numéro ajouté</b> : pour un bin « Source Clips », tu auras <code>Source Clips.1</code>, <code>Source Clips.2</code>… Passe le dossier en <b>View > Details</b> pour voir les dates de création et choisir la bonne version.</p>
<h3>5. Étape 1 : copier la sauvegarde sur le bureau</h3><ol><li>Minimise ton application Avid.</li><li>Ouvre le dossier Avid Attic depuis le bureau.</li><li>Double-clique le dossier du projet, puis <b>Bins</b>.</li><li>Ouvre le dossier du bin voulu.</li><li>Si besoin : <b>View > Details</b>.</li><li>Sélectionne le ou les fichiers de sauvegarde.</li><li><b>Ctrl+glisse</b> vers le bureau : c'est une <b>copie</b>, les originaux restent dans l'Attic.</li></ol>
<h3>6. Étape 2 : rouvrir la sauvegarde dans Avid</h3><ol><li>Restaure Avid depuis la barre des tâches.</li><li>Clique sur la fenêtre Projet, puis sur l'onglet <b>Bins</b>.</li><li><b>File > Open Bin</b>.</li><li>Dans « Files of Type », choisis <b>All Files (*.*)</b>.</li><li>Va sur le bureau, sélectionne la sauvegarde et clique <b>Open</b>.</li></ol>
<div class="note">Un lien vers ce bin est créé dans le dossier <b>Other Bins</b>.</div>
<h3>6 ter. File > Open Bin : la commande en détail</h3>
<p><b>Open Bin</b> est la commande du menu <b>File</b> qui sert à ouvrir un bin qui n'est pas déjà dans ton projet, ce qui est le cas d'une sauvegarde copiée sur le bureau. Elle ouvre une fenêtre de navigation comme celle de ton système, dans laquelle tu vas chercher le fichier.</p>
<ol><li><b>Active la fenêtre Projet</b> (clique dessus) puis l'onglet <b>Bins</b> : c'est de là que la commande agit sur ton projet.</li>
<li>Va dans le menu <b>File</b> et choisis <b>Open Bin</b>.</li>
<li>En bas de la fenêtre, dans la liste <b>Files of Type</b>, sélectionne <b>All Files (*.*)</b>. C'est indispensable : le nom d'une sauvegarde se termine par un numéro (Audio.1, Audio.2), donc avec le filtre par défaut tu risques de ne pas la voir.</li>
<li><b>Navigue jusqu'au bureau</b> et sélectionne la sauvegarde que tu as copiée.</li>
<li>Clique sur <b>Open</b> : le bin s'ouvre et un lien apparaît dans <b>Other Bins</b>.</li></ol>
<div class="note"><b>À ne pas confondre :</b> tu n'ouvres pas la sauvegarde en double-cliquant dessus dans l'Attic. Tu passes toujours par File > Open Bin, sur la <b>copie</b> placée sur le bureau, pour ne jamais toucher aux originaux de l'Attic.</div>
<div class="note"><b>Un bin à la fois :</b> comme Avid refuse d'ouvrir un bin et sa copie en même temps, ferme les autres bins avant d'ouvrir une sauvegarde, et répète File > Open Bin pour chaque sauvegarde, l'une après l'autre.</div>
<h3>6 bis. Other Bins : à quoi ça sert ?</h3>
<p><b>Other Bins</b> est un dossier de la fenêtre Projet, dans l'onglet <b>Bins</b>. Il liste les bins que tu ouvres alors qu'ils se trouvent <b>en dehors du dossier de ton projet</b>, ce qui est le cas de tes sauvegardes copiées sur le bureau.</p>
<ul><li><b>Ce n'est pas une copie :</b> Other Bins ne contient qu'un <b>lien</b> (un raccourci) vers le fichier resté sur le bureau. Le vrai fichier n'est pas déplacé dans ton projet.</li>
<li><b>Il se crée tout seul :</b> dès que tu ouvres une sauvegarde avec File > Open Bin, Avid ajoute le lien dans Other Bins. Tu n'as rien à faire.</li>
<li><b>Il permet de les retrouver :</b> tant que le lien est là, tu peux rouvrir la sauvegarde depuis la fenêtre Projet sans retourner la chercher sur le bureau.</li>
<li><b>Il faut le nettoyer :</b> une fois ton contenu récupéré dans le nouveau bin, supprime les liens de sauvegarde dans Other Bins, sinon ils restent dans ton projet et tu risques de les confondre avec tes vrais bins.</li></ul>
<div class="note"><b>Attention, deux suppressions distinctes :</b> supprimer le lien dans Other Bins ne supprime pas le fichier du bureau. Il faut ensuite glisser le fichier de sauvegarde du bureau dans la corbeille. Et n'oublie pas la règle d'or : garde ces bins fermés sauf celui que tu utilises.</div>
<h3>7. Étape 3 : récupérer le contenu</h3><ol><li><b>Crée un nouveau bin</b> (ex. « Audio New » pour récupérer Audio.2).</li><li>Sélectionne ce que tu veux garder dans la sauvegarde et <b>glisse-le</b> dans le nouveau bin.</li><li>Répète l'opération pour chaque autre sauvegarde copiée.</li></ol>
<div class="note"><b>Règle d'or :</b> Avid ne permet pas d'ouvrir en même temps un bin et sa copie. Garde tous les autres bins fermés et ouvre les sauvegardes <b>une à la fois</b>.</div>
<h3>8. Nettoyage final</h3><ol><li>Supprime les bins de sauvegarde (les liens) dans le dossier <b>Other Bins</b>.</li><li>Glisse les fichiers de sauvegarde du bureau dans la corbeille.</li></ol>
<h3>9. À retenir</h3><ul><li>Attic = sauvegardes automatiques, un dossier par projet puis par bin</li><li>Toujours <b>copier</b> (Ctrl+glisse), ne jamais déplacer l'original</li><li>Ouvrir avec <b>File > Open Bin</b> (fenêtre Projet, onglet Bins), filtre <b>All Files (*.*)</b>, sur la copie du <b>bureau</b></li><li><b>Other Bins</b> = les liens vers les bins ouverts hors du projet (tes sauvegardes du bureau), à supprimer à la fin</li><li>Un seul bin de sauvegarde ouvert à la fois, récupérer dans un <b>nouveau bin</b></li></ul>
<p style="text-align:center"><button class="mbtn p" onclick="toggleLes()">Passer au quiz →</button></p></div>`;
function toggleLes(){les=!les;$('les').textContent=les?'← Retour au quiz':'📖 Leçon';render();window.scrollTo(0,0)}
function render(){
  const card=$('card');
  if(les){card.innerHTML=LESSON;upd();return}
  if(cur>=list.length){
    const ok=Object.values(ans).filter(a=>a.ok).length;const pct=Math.round(ok/list.length*100);
    const msg=pct>=90?"Excellent, tu maîtrises l'Attic ! 🏆":pct>=60?"Bien joué, encore un petit effort. 👍":"Relis la leçon et retente ta chance. 📖";
    card.innerHTML=`<div class="end"><div class="big">${ok} / ${list.length}</div><p>${msg}</p><button class="mbtn p" onclick="reset()">Rejouer</button></div>`;upd();return}
  const x=Q[list[cur]],a=ans[list[cur]];
  let body;
  if(x.t){body=`<div class="txt"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tape ta réponse…" ${a?`disabled value="${a.txt.replace(/"/g,'&quot;')}" class="${a.ok?'ok':'ko'}"`:''}><button class="mbtn p" style="margin:0" onclick="submitT()" ${a?'disabled':''}>Valider</button></div>`}
  else body=`<div class="opts">${perm[list[cur]].map((k,i)=>`<button class="opt${a?(k===x.c?' ok':(i===a.pick?' ko':'')):(i===foc?' foc':'')}" ${a?'disabled':''} onclick="pick(${i})"><b>${'ABCDE'[i]}</b><span>${x.o[k]}</span></button>`).join('')}</div>`;
  card.innerHTML=`<span class="tag">${x.s}</span><div class="qn">Question ${cur+1} / ${list.length}</div><div class="qt">${x.q}</div>${body}${a?`<div class="fb ${a.ok?'g':'b'}">${a.ok?'✓ Bonne réponse !':'✗ Mauvaise réponse'}</div><div class="ex">${x.e}</div>`:''}<div class="nav"><button onclick="go(-1)" ${cur?'':'disabled'}>← Précédent</button><button onclick="go(1)">${cur===list.length-1?'Voir le bilan':'Suivant →'}</button></div>`;
  if(x.t&&!a)$('ti').focus();
  upd();
}
function upd(){
  const n=Object.keys(ans).length,ok=Object.values(ans).filter(a=>a.ok).length;
  $('stat').textContent=`✓ ${ok} / ${n}`;$('pb').style.width=(n/list.length*100)+'%';
  $('dots').innerHTML=list.map((q,i)=>`<div class="dot${ans[q]?(ans[q].ok?' g':' b'):''}${i===cur&&!les?' cur':''}" onclick="les=false;$('les').textContent='📖 Leçon';cur=${i};foc=0;render()"></div>`).join('');
}
function pick(i){const q=list[cur];if(ans[q]||Q[q].t)return;ans[q]={pick:i,ok:perm[q][i]===Q[q].c};render()}
function submitT(){const q=list[cur],x=Q[q];if(ans[q])return;const v=$('ti').value;if(!norm(v))return;ans[q]={txt:v,ok:x.a.includes(norm(v))};render()}
function go(d){cur=Math.max(0,Math.min(list.length,cur+d));foc=0;render()}
function reset(){mk();ans={};cur=0;foc=0;list=Q.map((x,i)=>i);render()}
$('rst').onclick=reset;$('les').onclick=toggleLes;
$('shf').onclick=()=>{mk();ans={};cur=0;foc=0;list=Q.map((x,i)=>i).sort(()=>Math.random()-.5);render()};
$('thm').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';$('thm').textContent=d?'☀️':'🌙'};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Enter')submitT();return}
  if(les){if(e.key==='Escape')toggleLes();return}
  const q=list[cur],x=Q[q],a=ans[q];
  if(e.key==='ArrowRight'){go(1);return}
  if(e.key==='ArrowLeft'){go(-1);return}
  if(cur>=list.length)return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();document.activeElement.blur();if(a)go(1);else if(!x.t)pick(foc);return}
  if(x.t||a)return;
  if(e.key==='ArrowDown'){e.preventDefault();foc=(foc+1)%x.o.length;render()}
  else if(e.key==='ArrowUp'){e.preventDefault();foc=(foc+x.o.length-1)%x.o.length;render()}
  else{const k='abcde'.indexOf(e.key.toLowerCase());const m='12345'.indexOf(e.key);const v=k>=0?k:m;if(v>=0)pick(v)}
});
render();
</script>
